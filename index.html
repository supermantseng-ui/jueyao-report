<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>經營報表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
  /* ---------- 設定 ---------- */
  :root {
    --concrete: #E9ECEA;   /* 底色：水泥灰 */
    --slab:     #F6F7F6;   /* 區塊 */
    --ink:      #1E2B2F;   /* 主要文字 */
    --muted:    #5F6B6E;   /* 次要文字 */
    --rule:     #C9CFCC;   /* 分隔線 */
    --steel:    #2F5D7C;   /* 主色：鋼藍 */
    --steel-lt: #B9CBD7;
    --safety:   #E8B21E;   /* 警示：安全黃 */
    --gain:     #2F7A55;
    --loss:     #B23A2E;
    --num: 'Barlow Semi Condensed', 'Noto Sans TC', sans-serif;
    --txt: 'Noto Sans TC', -apple-system, 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --concrete: #1B2224; --slab: #232C2F; --ink: #E4E9E7; --muted: #9AA6A8;
      --rule: #3A4548; --steel: #7FA8C4; --steel-lt: #3D5566;
      --gain: #6FBF95; --loss: #E07A6E;
    }
  }
  :root[data-theme="dark"] {
    --concrete: #1B2224; --slab: #232C2F; --ink: #E4E9E7; --muted: #9AA6A8;
    --rule: #3A4548; --steel: #7FA8C4; --steel-lt: #3D5566;
    --gain: #6FBF95; --loss: #E07A6E;
  }

  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--concrete); color: var(--ink);
    font-family: var(--txt); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--safety); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- 登入 ---------- */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login form {
    width: 100%; max-width: 360px; background: var(--slab);
    border-top: 6px solid var(--steel); padding: 32px 28px 28px;
  }
  .login h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .login p { margin: 0 0 24px; color: var(--muted); font-size: .9rem; }
  .field { display: block; margin-bottom: 16px; }
  .field span { display: block; font-size: .875rem; color: var(--muted); margin-bottom: 4px; }
  .field input {
    width: 100%; padding: 10px 12px; background: var(--concrete);
    border: 1px solid var(--rule); border-radius: 2px;
  }
  .btn {
    width: 100%; padding: 11px; border: 0; border-radius: 2px; cursor: pointer;
    background: var(--steel); color: #fff; font-weight: 700;
  }
  .btn:disabled { opacity: .6; cursor: default; }
  .error { color: var(--loss); font-size: .875rem; margin: 12px 0 0; min-height: 1.4em; }

  /* ---------- 版面 ---------- */
  header.top {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    max-width: 1080px; margin: 0 auto; padding: 20px 24px 8px;
  }
  header.top h1 { margin: 0; font-size: 1.125rem; font-weight: 700; }
  header.top .who { color: var(--muted); font-size: .875rem; }
  header.top .who button {
    background: none; border: 0; color: var(--steel); cursor: pointer; padding: 0 0 0 12px;
    text-decoration: underline; text-underline-offset: 3px;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 8px 24px 48px; }
  section { margin-top: 32px; }
  h2 { font-size: 1rem; margin: 0 0 12px; font-weight: 700; }
  .note { color: var(--muted); font-size: .875rem; margin: 6px 0 0; }

  /* ---------- 結算單（主角） ---------- */
  .ledger {
    background: var(--slab); padding: 28px 32px 32px; position: relative;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 40px; align-items: end;
  }
  .ledger .month { grid-column: 1 / -1; color: var(--muted); font-size: .95rem; margin-bottom: 8px; }
  .footing { max-width: 520px; }
  .footing .row {
    display: grid; grid-template-columns: 1.5em 1fr auto; align-items: baseline;
    padding: 6px 0;
  }
  .footing .op { color: var(--muted); font-family: var(--num); font-size: 1.4rem; }
  .footing .label { font-size: 1rem; }
  .footing .amt { font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 600; text-align: right; }
  .footing .total { border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 10px; }
  .footing .total .amt { color: var(--steel); font-size: clamp(2.5rem, 7vw, 4rem); font-weight: 700; }
  .footing .total::after {          /* 雙底線：會計加總收尾 */
    content: ''; grid-column: 1 / -1; height: 7px; margin-top: 8px;
    border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
  }
  .rate { text-align: right; padding-bottom: 22px; }
  .rate .v { font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; display: block; line-height: 1; }
  .rate .k { color: var(--muted); font-size: .875rem; }
  .stamp {
    position: absolute; top: 22px; right: 28px; transform: rotate(-8deg);
    border: 3px solid var(--safety); color: #8A6400; padding: 2px 12px;
    font-weight: 700; font-size: 1.05rem; letter-spacing: .2em; border-radius: 3px;
    background: color-mix(in srgb, var(--safety) 12%, transparent);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stamp { color: var(--safety); } }
  .bytype { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 28px; margin-top: 16px; color: var(--muted); font-size: .9rem; }
  .bytype b { color: var(--ink); font-weight: 600; font-family: var(--num); font-size: 1.05rem; margin-left: 6px; }

  /* ---------- 趨勢 ---------- */
  .chart-wrap { overflow-x: auto; background: var(--slab); padding: 20px 16px 8px; }
  .chart-wrap svg { display: block; min-width: 560px; width: 100%; height: auto; }
  .legend { display: flex; gap: 20px; font-size: .875rem; color: var(--muted); margin: 0 0 8px 8px; }
  .legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; }

  /* ---------- 資金位置 ---------- */
  .position { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; background: var(--slab); }
  .position > div { padding: 20px 24px; border-left: 4px solid var(--rule); }
  .position > div:first-child { border-left-color: var(--steel); }
  .position > div:nth-child(2) { border-left-color: var(--muted); }
  .position > div:nth-child(3) { border-left-color: var(--steel-lt); }
  .position h3 { margin: 0 0 4px; font-size: .95rem; font-weight: 500; color: var(--muted); }
  .position .big { font-size: 2rem; font-weight: 600; line-height: 1.2; }
  .position dl { margin: 10px 0 0; display: grid; grid-template-columns: auto auto; justify-content: space-between; gap: 2px 12px; font-size: .875rem; }
  .position dt { color: var(--muted); }
  .position dd { margin: 0; text-align: right; font-family: var(--num); font-size: 1rem; }
  .position .warn { color: var(--loss); font-weight: 600; }

  /* ---------- 客戶排名 ---------- */
  .table-wrap { overflow-x: auto; background: var(--slab); }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { padding: 10px 16px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  th { font-weight: 500; color: var(--muted); font-size: .85rem; }
  td.r, th.r { text-align: right; }
  .bar { display: inline-block; height: 8px; background: var(--steel); vertical-align: middle; margin-left: 8px; }
  .empty { padding: 28px 16px; color: var(--muted); }


  /* ---------- 頁籤 ---------- */
  nav.tabs { max-width: 1080px; margin: 0 auto; padding: 0 24px; display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--rule); }
  nav.tabs button {
    background: none; border: 0; padding: 10px 14px 9px; cursor: pointer; white-space: nowrap;
    color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px;
  }
  nav.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--steel); }

  /* ---------- 工具列 ---------- */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 24px 0 12px; }
  .toolbar label { color: var(--muted); font-size: .9rem; display: flex; align-items: center; gap: 8px; }
  .toolbar select, .toolbar input[type="search"], .toolbar input[type="date"] {
    padding: 7px 10px; background: var(--slab); border: 1px solid var(--rule); border-radius: 2px; color: var(--ink);
  }
  .toolbar .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; }
  .seg button { background: var(--slab); border: 0; padding: 7px 14px; cursor: pointer; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button[aria-pressed="true"] { background: var(--steel); color: #fff; }
  .btn-line {
    background: var(--slab); border: 1px solid var(--steel); color: var(--steel);
    padding: 7px 14px; border-radius: 2px; cursor: pointer; font-weight: 500;
  }
  .status-line { color: var(--muted); font-size: .9rem; margin: 0 0 8px; }

  /* ---------- 通用表格 ---------- */
  .grid-wrap { overflow: auto; max-height: 70vh; background: var(--slab); }
  .grid-wrap table thead th { position: sticky; top: 0; background: var(--slab); z-index: 1; box-shadow: inset 0 -1px 0 var(--rule); }
  .grid-wrap tfoot td { font-weight: 700; border-top: 2px solid var(--ink); border-bottom: 0; position: sticky; bottom: 0; background: var(--slab); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td, tr.selected td { background: color-mix(in srgb, var(--steel) 9%, transparent); }
  .tag { display: inline-block; padding: 0 8px; border-radius: 2px; font-size: .8rem; line-height: 1.7; }
  .tag.est  { background: color-mix(in srgb, var(--safety) 25%, transparent); color: var(--ink); }
  .tag.bad  { background: color-mix(in srgb, var(--loss) 15%, transparent); color: var(--loss); }
  .tag.good { background: color-mix(in srgb, var(--gain) 15%, transparent); color: var(--gain); }
  .tag.plain{ background: var(--concrete); color: var(--muted); }
  td.neg { color: var(--loss); }
  .subhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 32px 0 12px; }
  .subhead h2 { margin: 0; }
  .ledger-panel { margin-top: 28px; }

  @media (max-width: 720px) {
    header.top, main, nav.tabs { padding-left: 16px; padding-right: 16px; }
    .ledger { grid-template-columns: 1fr; padding: 24px 20px; }
    .rate { text-align: left; padding-bottom: 0; }
    .position { grid-template-columns: 1fr; }
    .position > div + div { border-top: 1px solid var(--rule); }
    .stamp { top: 16px; right: 16px; }
    .ledger .month { padding-right: 84px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .ledger.reveal .total { animation: settle .6s ease-out .15s both; }
    @keyframes settle { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>

<!-- 登入 -->
<div class="login" id="login-view" hidden>
  <form id="login-form" novalidate>
    <h1>經營報表</h1>
    <p>請用公司開通的帳號登入</p>
    <label class="field"><span>電子郵件</span>
      <input type="email" id="email" autocomplete="username" required></label>
    <label class="field"><span>密碼</span>
      <input type="password" id="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit" id="login-btn">登入</button>
    <p class="error" id="login-error" role="alert"></p>
  </form>
</div>

<!-- 報表 -->
<div id="app-view" hidden>
  <header class="top">
    <h1>經營報表</h1>
    <div class="who"><span id="who-name"></span><button type="button" id="logout-btn">登出</button></div>
  </header>
  <nav class="tabs" role="tablist" aria-label="報表">
    <button role="tab" data-tab="overview">總覽</button>
    <button role="tab" data-tab="margin">毛利明細</button>
    <button role="tab" data-tab="inventory">進銷存</button>
    <button role="tab" data-tab="ar">應收</button>
    <button role="tab" data-tab="ap">應付</button>
  </nav>
  <main>
    <p class="note" id="loading" hidden>讀取中…</p>
    <p class="error" id="app-error" role="alert"></p>

    <!-- 總覽 -->
    <div class="page" data-page="overview" hidden>
      <div style="height:16px"></div>
      <div class="ledger" id="ledger"></div>
      <section>
        <h2>近 12 個月營收與毛利</h2>
        <div class="chart-wrap">
          <div class="legend"><span><i style="background:var(--steel-lt)"></i>營收</span><span><i style="background:var(--steel)"></i>毛利</span></div>
          <div id="chart"></div>
        </div>
      </section>
      <section>
        <h2>資金位置</h2>
        <div class="position" id="position"></div>
        <p class="note">應收、應付的「已開發票／已請款」為含稅金額；「待開」為未稅金額，開立時另加 5% 營業稅。</p>
      </section>
      <section>
        <h2>本月客戶毛利排行</h2>
        <div class="table-wrap" id="customers"></div>
      </section>
    </div>

    <!-- 毛利明細 -->
    <div class="page" data-page="margin" hidden>
      <div class="toolbar">
        <label>月份 <select id="m-month"></select></label>
        <div class="seg" id="m-view">
          <button type="button" data-v="lines" aria-pressed="true">逐筆</button>
          <button type="button" data-v="customer" aria-pressed="false">依客戶</button>
          <button type="button" data-v="item" aria-pressed="false">依品項</button>
        </div>
        <label><input type="search" id="m-filter" placeholder="篩選客戶、建案或品項"></label>
        <span class="spacer"></span>
        <button type="button" class="btn-line" id="m-export">匯出 Excel</button>
      </div>
      <p class="status-line" id="m-status"></p>
      <div class="grid-wrap" id="m-table"></div>
    </div>

    <!-- 進銷存 -->
    <div class="page" data-page="inventory" hidden>
      <div class="toolbar">
        <label>月份 <select id="i-month"></select></label>
        <label><input type="search" id="i-filter" placeholder="篩選品項"></label>
        <span class="spacer"></span>
        <button type="button" class="btn-line" id="i-export">匯出 Excel</button>
      </div>
      <p class="status-line" id="i-status"></p>
      <div class="grid-wrap" id="i-table"></div>
      <div class="ledger-panel" id="i-ledger" hidden>
        <div class="subhead"><h2 id="i-ledger-title"></h2>
          <button type="button" class="btn-line" id="i-ledger-export">匯出 Excel</button></div>
        <div class="toolbar" style="margin-top:0">
          <label>期間 <input type="date" id="i-from"> 至 <input type="date" id="i-to"></label>
          <button type="button" class="btn-line" id="i-ledger-go">查詢</button>
        </div>
        <div class="grid-wrap" id="i-ledger-table"></div>
      </div>
    </div>

    <!-- 應收 -->
    <div class="page" data-page="ar" hidden>
      <div class="subhead"><h2>客戶應收總覽</h2><button type="button" class="btn-line" data-export="ar-summary">匯出 Excel</button></div>
      <div class="grid-wrap" id="ar-summary"></div>
      <div class="subhead"><h2>發票</h2>
        <div class="toolbar" style="margin:0">
          <div class="seg" id="ar-status">
            <button type="button" data-v="open" aria-pressed="true">未收清</button>
            <button type="button" data-v="all" aria-pressed="false">全部</button>
          </div>
          <button type="button" class="btn-line" data-export="ar-invoices">匯出 Excel</button>
        </div></div>
      <div class="grid-wrap" id="ar-invoices"></div>
      <div class="subhead"><h2>待開發票（未稅）</h2><button type="button" class="btn-line" data-export="ar-uninvoiced">匯出 Excel</button></div>
      <div class="grid-wrap" id="ar-uninvoiced"></div>
    </div>

    <!-- 應付 -->
    <div class="page" data-page="ap" hidden>
      <div class="subhead"><h2>供應商應付總覽</h2><button type="button" class="btn-line" data-export="ap-summary">匯出 Excel</button></div>
      <div class="grid-wrap" id="ap-summary"></div>
      <div class="subhead"><h2>請款單</h2>
        <div class="toolbar" style="margin:0">
          <div class="seg" id="ap-status">
            <button type="button" data-v="open" aria-pressed="true">未付清</button>
            <button type="button" data-v="all" aria-pressed="false">全部</button>
          </div>
          <button type="button" class="btn-line" data-export="ap-bills">匯出 Excel</button>
        </div></div>
      <div class="grid-wrap" id="ap-bills"></div>
      <div class="subhead"><h2>待彙總請款（未稅）</h2><button type="button" class="btn-line" data-export="ap-unbilled">匯出 Excel</button></div>
      <div class="grid-wrap" id="ap-unbilled"></div>
    </div>
  </main>
</div>
<script>
const CFG = window.REPORT_CONFIG || {};
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
const fmt = (n) => Math.round(Number(n) || 0).toLocaleString('zh-TW');
const fmtQty = (n) => (n == null || n === '') ? '' : Number(n).toLocaleString('zh-TW', { maximumFractionDigits: 2 });
const fmtCost = (n) => (n == null || n === '') ? '—' : Number(n).toLocaleString('zh-TW', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const monthLabel = (ym) => { const [y, m] = ym.split('-'); return `${y} 年 ${Number(m)} 月`; };
const monthRange = (ym) => { const [y, m] = ym.split('-').map(Number); const last = new Date(y, m, 0).getDate(); return [`${ym}-01`, `${ym}-${String(last).padStart(2, '0')}`]; };

async function api(action, params = {}) {
  const { data, error } = await sb.functions.invoke('report-api', { body: { action, ...params } });
  if (error) {
    let msg = '讀取資料失敗，請稍後再試';
    try { const body = await error.context.json(); if (body?.error) msg = body.error; } catch (_) {}
    throw new Error(msg);
  }
  return data;
}

async function load(fn) {
  $('loading').hidden = false; $('app-error').textContent = '';
  try { await fn(); } catch (err) { $('app-error').textContent = err.message; }
  finally { $('loading').hidden = true; }
}

function show(view) {
  $('login-view').hidden = view !== 'login';
  $('app-view').hidden = view !== 'app';
}

/* ---------- 通用表格 ----------
   欄位型別：text、amt（金額，整數）、qty（數量）、cost（單價，兩位小數）、pct（%）、tag（標籤）
   sum: true → 表尾合計 */
function table(cols, rows, opts = {}) {
  if (!rows.length) return `<p class="empty">${opts.empty || '沒有資料。'}</p>`;
  const cell = (c, r) => {
    const v = r[c.k];
    switch (c.t) {
      case 'amt':  return `<td class="r num${Number(v) < 0 ? ' neg' : ''}">${v == null || v === '' ? '' : fmt(v)}</td>`;
      case 'qty':  return `<td class="r num${Number(v) < 0 ? ' neg' : ''}">${fmtQty(v)}</td>`;
      case 'cost': return `<td class="r num">${fmtCost(v)}</td>`;
      case 'pct':  return `<td class="r num">${v == null ? '—' : v + '%'}</td>`;
      case 'tag':  return `<td>${c.tag(v, r)}</td>`;
      default:     return `<td>${esc(c.f ? c.f(v, r) : v) || (c.dash ? '—' : '')}</td>`;
    }
  };
  const hasSum = cols.some((c) => c.sum);
  const foot = hasSum ? `<tfoot><tr>${cols.map((c, i) => {
    if (c.sum) { const s = rows.reduce((a, r) => a + (Number(r[c.k]) || 0), 0); return `<td class="r num">${c.t === 'qty' ? fmtQty(s) : fmt(s)}</td>`; }
    return i === 0 ? `<td>合計 ${rows.length} 筆</td>` : '<td></td>';
  }).join('')}</tr></tfoot>` : '';
  return `<table><thead><tr>${cols.map((c) => `<th class="${['amt', 'qty', 'cost', 'pct'].includes(c.t) ? 'r' : ''}">${esc(c.l || c.k)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r, i) => `<tr${opts.click ? ` class="clickable" data-i="${i}" tabindex="0"` : ''}>${cols.map((c) => cell(c, r)).join('')}</tr>`).join('')}</tbody>${foot}</table>`;
}

function exportXlsx(filename, cols, rows) {
  const data = rows.map((r) => Object.fromEntries(cols.map((c) => {
    let v = r[c.k];
    if (['amt', 'qty', 'cost'].includes(c.t) && v !== null && v !== '' && v !== undefined) v = Number(v);
    return [c.l || c.k, v ?? ''];
  })));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '報表');
  XLSX.writeFile(wb, `${filename}.xlsx`);
}

function renderChart(rows) {
  if (!rows.length) { $('chart').innerHTML = '<p class="empty">還沒有已認列的銷貨資料。</p>'; return; }
  const W = 760, H = 240, pl = 56, pr = 12, pt = 12, pb = 36;
  const max = Math.max(...rows.map((r) => Number(r['營收']) || 0), 1);
  const step = (W - pl - pr) / rows.length, bw = Math.min(36, step * 0.6);
  const y = (v) => pt + (H - pt - pb) * (1 - (Number(v) || 0) / max);
  const ticks = [0, 0.5, 1].map((t) => max * t);
  const grid = ticks.map((t) => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--rule)"/>
    <text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="var(--num)">${fmt(t)}</text>`).join('');
  const bars = rows.map((r, i) => {
    const x = pl + step * i + (step - bw) / 2;
    const rev = Number(r['營收']) || 0, gp = Math.max(Number(r['毛利']) || 0, 0);
    const [, m] = r['月份'].split('-');
    return `<g><title>${esc(r['月份'])}　營收 ${fmt(rev)}　毛利 ${fmt(r['毛利'])}（${r['毛利率'] ?? '—'}%）</title>
      <rect x="${x}" y="${y(rev)}" width="${bw}" height="${y(0) - y(rev)}" fill="var(--steel-lt)"/>
      <rect x="${x + bw * 0.2}" y="${y(gp)}" width="${bw * 0.6}" height="${y(0) - y(gp)}" fill="var(--steel)"/>
      <text x="${x + bw / 2}" y="${H - pb + 18}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--num)">${Number(m)}月</text></g>`;
  }).join('');
  $('chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近 12 個月營收與毛利長條圖">${grid}${bars}</svg>`;
}

}
function loadAp() { return load(async () => { S.ap = await api('ap'); renderAp(); }); }
$('ap-status').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  S.apStatus = b.dataset.v;
  $('ap-status').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  renderAp();
});

document.querySelectorAll('[data-export]').forEach((b) => b.addEventListener('click', () => {
  const k = b.dataset.export, today = new Date().toISOString().slice(0, 10);
  const names = { 'ar-summary': '客戶應收總覽', 'ar-invoices': '發票', 'ar-uninvoiced': '待開發票', 'ap-summary': '供應商應付總覽', 'ap-bills': '請款單', 'ap-unbilled': '待彙總請款' };
  const cols = AR_COLS[k] || AP_COLS[k];
  const rows = k.startsWith('ar') ? arData(k) : apData(k);
  exportXlsx(`${names[k]}_${today}`, cols, rows);
}));

/* ---------- 登入 ---------- */
$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('login-btn');
  $('login-error').textContent = '';
  btn.disabled = true; btn.textContent = '登入中…';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  btn.disabled = false; btn.textContent = '登入';
  if (error) { $('login-error').textContent = '電子郵件或密碼不正確'; return; }
  start();
});
$('logout-btn').addEventListener('click', async () => { await sb.auth.signOut(); S.loaded = {}; show('login'); });

async function start() {
  show('app');
  await load(async () => {
    const [me, meta] = await Promise.all([api('me'), api('meta')]);
    $('who-name').textContent = me.displayName || me.email;
    S.meta = meta;
    activate(currentTab());
  });
}

sb.auth.getSession().then(({ data }) => (data.session ? start() : show('login')));
sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') show('login'); });
</script>
</body>
